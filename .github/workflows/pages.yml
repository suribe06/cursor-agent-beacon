name: Deploy display simulator

on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - "themes/standard/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site/preview _site/themes/standard
          cp preview/display-simulator.html preview/beacon-sprites.js _site/preview/
          cp -a themes/standard/assets _site/themes/standard/
          # Root landing → simulator
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>Cursor Agent Beacon — Display Simulator</title>
          <meta http-equiv="refresh" content="0; url=preview/display-simulator.html">
          <link rel="canonical" href="preview/display-simulator.html">
          <p><a href="preview/display-simulator.html">Open display simulator</a></p>
          EOF

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
